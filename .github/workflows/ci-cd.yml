name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build-and-push:
    name: Build & push (${{ matrix.app }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: backend
            context: ./backend
          - app: frontend
            context: ./frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Authenticate only when we actually intend to push (i.e. push to main).
      # PRs from the same repo could push too, but we keep them build-only.
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # metadata-action lowercases the image name automatically,
          # which GHCR requires (the repo name contains uppercase letters).
          images: ghcr.io/${{ github.repository }}-${{ matrix.app }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          # Push only on push to main; pull requests build for validation only.
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to server
    needs: build-and-push
    # Only deploy on push to main — never on pull requests.
    if: github.event_name == 'push'
    runs-on: [self-hosted]
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pulls the freshly pushed :latest images referenced in docker-compose.yml
      # and recreates any container whose image changed.
      #
      # Compose runs from DEPLOY_DIR, not from the workspace: actions/checkout
      # cleans with "git clean -ffdx", and -x includes ignored files, so a .env
      # and a wallet living here would be wiped on every deploy. DEPLOY_DIR holds
      # both and is never checked out. Until it exists the deploy falls back to
      # the workspace, which means the in-memory profile (see README > Despliegue).
      - name: Pull latest images and restart
        env:
          DEPLOY_DIR: /opt/financeai
        run: |
          if [ -d "$DEPLOY_DIR" ]; then
            cp docker-compose.yml "$DEPLOY_DIR/docker-compose.yml"
            cd "$DEPLOY_DIR"
          else
            echo "::warning::$DEPLOY_DIR not found - deploying from the workspace without .env or wallet"
          fi
          docker compose pull
          docker compose up -d

      - name: Remove unused images
        run: docker image prune -f
