# Runs the images published to GHCR by .github/workflows/ci-cd.yml.
# The image names are the lowercased repository path + "-backend" / "-frontend",
# which is what docker/metadata-action pushes.
services:
  backend:
    image: ghcr.io/no-country-simulation/g9-latam-team62-backend:latest
    container_name: fintech-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    # Values come from the .env file next to this one (see .env.example).
    # "Next to this one" is the repository root locally, and the deploy directory
    # on the server -- the CI job copies this file there and runs compose from it,
    # so every relative path below resolves against whichever of the two is in use.
    # Unset means the in-memory "dev" profile, i.e. the behaviour before Oracle:
    # set SPRING_PROFILES_ACTIVE=oracle once the wallet and credentials are in place.
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      # No default on purpose: the backend refuses to start without a signing key,
      # so a missing JWT_SECRET fails loudly here instead of falling back to a
      # value anyone could read in the repository. See .env.example.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET no está definido en el .env — generar con "openssl rand -hex 32"}
      ORACLE_JDBC_URL: ${ORACLE_JDBC_URL:-}
      ORACLE_DB_USER: ${ORACLE_DB_USER:-}
      ORACLE_DB_PASSWORD: ${ORACLE_DB_PASSWORD:-}
    volumes:
      # Unzipped Autonomous Database wallet; read-only, never committed.
      - ./secrets/wallet:/app/wallet:ro

  frontend:
    image: ghcr.io/no-country-simulation/g9-latam-team62-frontend:latest
    container_name: fintech-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
