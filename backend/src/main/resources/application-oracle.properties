# Oracle Autonomous Database (ATP) over a wallet.
#
# Required environment variables:
#   ORACLE_JDBC_URL      jdbc:oracle:thin:@<tns_alias>?TNS_ADMIN=/app/wallet
#                        (<tns_alias> is a service name from the wallet's tnsnames.ora,
#                         e.g. financeai_tp — use the _tp service for this API)
#   ORACLE_DB_USER       application schema user, e.g. FINTECH_APP (not ADMIN)
#   ORACLE_DB_PASSWORD   password of that user
spring.datasource.url=${ORACLE_JDBC_URL}
spring.datasource.username=${ORACLE_DB_USER}
spring.datasource.password=${ORACLE_DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# An Always Free ATP instance is small; a modest pool is plenty and keeps the
# database's own session limit out of trouble.
spring.datasource.hikari.maximum-pool-size=${ORACLE_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${ORACLE_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1200000

# The schema is owned by db/oracle/schema.sql, applied once by hand.
# Hibernate only checks that the tables match the entities and refuses to start
# if they drifted apart.
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never
spring.jpa.show-sql=false
