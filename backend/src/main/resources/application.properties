# ── Oracle configuration ─────────────────────────
spring.datasource.url=jdbc:oracle:thin:@fintech_low?TNS_ADMIN=src/main/resources/Wallet_fintech
spring.datasource.username=${ORACLE_DB_USERNAME:FINTECH_USER}
spring.datasource.password=${ORACLE_DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=none

spring.jpa.show-sql=true

# ── ML Inference Service ─────────────────────────────────────────
# Disabled by default. Enable when the Data team deploys the model.
ml.inference.enabled=false
ml.inference.url=
