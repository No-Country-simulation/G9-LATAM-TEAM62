spring.application.name=fintech-api

# Profiles
#   dev    (default) in-memory H2, no external service needed
#   oracle            Oracle Autonomous Database over a wallet (mTLS)
#   local             Local developer profile
spring.profiles.default=dev

# ── Configuración de Proxy ───────────────────────────────────────
# Habilita el soporte para las cabeceras X-Forwarded-* cuando se está detrás de un proxy inverso (Nginx, AWS, Cloudflare, etc.).
# Esto asegura que request.getRemoteAddr() devuelva la IP real del cliente de forma segura.
server.forward-headers-strategy=framework

# JPA settings shared by every profile
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ── Firma de tokens JWT ──────────────────────────────────────────
# Sin valor por defecto a propósito. Si JWT_SECRET no está definida la aplicación
# no arranca: una clave versionada en el repositorio permite a cualquiera que lo
# lea firmar tokens válidos para cualquier cuenta, lo que anula las validaciones
# de propiedad de AuthorizationHelper.
#
# Generar con:  openssl rand -hex 32
# En local:     export JWT_SECRET=...   (o definirla en el .env de docker compose)
jwt.secret=${JWT_SECRET:}

# Vigencia del token en milisegundos (10 minutos por defecto).
jwt.expiration=${JWT_EXPIRATION:600000}

# ── ML Inference Service ─────────────────────────────────────────
# Disabled by default. Enable when the Data team deploys the model.
ml.inference.enabled=false
ml.inference.url=

# 1. Limitar el tamaño de las peticiones (previene ataques de payload gigante)
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

# 2. Configurar tiempos de espera (cierra conexiones lentas/colgadas)
server.tomcat.connection-timeout=5000

# 3. Limitar la concurrencia (evita agotar la CPU/RAM creando hilos infinitos)
# Máximo de hilos procesando peticiones simultáneamente
server.tomcat.threads.max=200
# Cola máxima de peticiones en espera cuando los hilos están ocupados
server.tomcat.accept-count=100

# Deshabilitar la autoconfiguración del starter de Bucket4j ya que se usa RateLimitInterceptor personalizado
bucket4j.enabled=false

# Orígenes permitidos separados por coma
cors.allowed-origins=http://161.153.219.191,http://161.153.219.191:80,http://localhost:3000,http://localhost:5173,http://127.0.0.1:5500,http://localhost:5500,http://localhost:8080

# Carga de datos de semilla para la base de datos de desarrollo (H2)
spring.sql.init.data-locations=classpath:seed_testing.sql
spring.jpa.defer-datasource-initialization=true



