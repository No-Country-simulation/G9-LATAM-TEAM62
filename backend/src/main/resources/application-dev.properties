# Local development and tests: in-memory H2, schema created by Hibernate from the
# entities and seeded by data.sql. Nothing here reaches Oracle.
spring.datasource.url=jdbc:h2:mem:fintech;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true

spring.jpa.hibernate.ddl-auto=create-drop
# data.sql must run after Hibernate has created the tables
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=true
